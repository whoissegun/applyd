# FastAPI web service. Public, listens on $PORT (Railway injects it).
# Point Railway → service → Config-as-Code Path → railway/api.toml

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "sh -c 'uvicorn applyd.api.app:app --host 0.0.0.0 --port ${PORT:-8000}'"
# ALWAYS, not ON_FAILURE+maxRetries: the apply watchdog exits on purpose
# (hung CDP socket) and expects a restart. maxRetries is a fixed per-deploy
# budget, not a rolling window - 10 watchdog exits marked the July 11 deploy
# CRASHED and the worker stayed down for days.
restartPolicyType = "ALWAYS"
healthcheckPath = "/healthz"
healthcheckTimeout = 30
