# Apply worker. Polls applications.status='tailored', drives the tool-use loop
# over Bright Data Chrome via CDP. One replica ≈ one concurrent Bright Data
# session — add replicas to parallelize, not bigger instances.
#
# REQUIRED env: BRIGHTDATA_CUSTOMER_ID, BRIGHTDATA_ZONE,
# BRIGHTDATA_ZONE_PASSWORD, BRIGHTDATA_HOST, BRIGHTDATA_CDP_PORT,
# OPENROUTER_API_KEY, APPLYD_TEST_MODE.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "python -m applyd.worker.runner"
# ALWAYS, not ON_FAILURE+maxRetries: the apply watchdog exits on purpose
# (hung CDP socket) and expects a restart. maxRetries is a fixed per-deploy
# budget, not a rolling window - 10 watchdog exits marked the July 11 deploy
# CRASHED and the worker stayed down for days.
restartPolicyType = "ALWAYS"
