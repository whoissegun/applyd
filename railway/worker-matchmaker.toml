# Matchmaker. For each user, scores unevaluated active jobs against their
# profile_answers + resume_text using the cheap Haiku matcher. Accepted
# matches become applications.status='pending' for the tailor worker.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "python -m applyd.worker.matchmaker"
# ALWAYS, not ON_FAILURE+maxRetries: the apply watchdog exits on purpose
# (hung CDP socket) and expects a restart. maxRetries is a fixed per-deploy
# budget, not a rolling window - 10 watchdog exits marked the July 11 deploy
# CRASHED and the worker stayed down for days.
restartPolicyType = "ALWAYS"
