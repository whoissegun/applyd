# Combined early-stage worker. Alternates:
#   1. tailor up to APPLYD_TAILOR_BATCH pending applications
#   2. apply to up to APPLYD_APPLY_BATCH tailored applications
#
# Discovery, enrichment, and matchmaker are manual for now.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "python -m applyd.worker.all"
# ALWAYS, not ON_FAILURE+maxRetries: the apply watchdog exits on purpose
# (hung CDP socket) and expects a restart. maxRetries is a fixed per-deploy
# budget, not a rolling window - 10 watchdog exits marked the July 11 deploy
# CRASHED and the worker stayed down for days.
restartPolicyType = "ALWAYS"
