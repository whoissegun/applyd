[project]
name = "applyd"
version = "0.1.0"
description = "Local-first autonomous job application engine"
requires-python = ">=3.11"
dependencies = [
    "fastembed>=0.7,<0.8",
    "httpx>=0.27",
    "numpy>=2.3",
    "pydantic>=2.7",
    "trafilatura>=1.12",
    "openai>=1.40",
    "playwright>=1.40",
]

[project.scripts]
applyd = "applyd.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
