<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Example Engineering Application</title></head>
<body>
  <h1>Software Engineer — Example</h1>
  <form id="application-form">
    <label for="name">Full name *</label>
    <input id="name" name="name" required>

    <label for="email">Email *</label>
    <input id="email" name="email" type="email" required>

    <label for="phone">Phone *</label>
    <input id="phone" name="phone" required>

    <label for="resume">Resume *</label>
    <input id="resume" name="resume" type="file" required>

    <label for="why">Why are you interested in this role? *</label>
    <textarea id="why" name="why" required></textarea>

    <label for="website">Personal website</label>
    <input id="website" name="website">

    <button type="submit">Submit application</button>
  </form>
</body>
</html>
