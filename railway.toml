# Root Railway config. Shared by every service.
# Per-service start commands + cron schedules live in railway/<service>.toml —
# point each Railway service's "Config-as-Code Path" at the matching file.
#
# See DEPLOY.md for the full per-service breakdown.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

# Default deploy — fine for the api service if you don't set a per-service path.
[deploy]
startCommand = "sh -c 'uvicorn applyd.api.app:app --host 0.0.0.0 --port ${PORT:-8000}'"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
